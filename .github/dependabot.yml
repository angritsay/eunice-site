# Weekly updates, grouped, and never for a release younger than a week: the same
# quarantine pnpm applies at install time (ADR-0002).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tooling:
        patterns: ['*']
    ignore:
      # The architecture check (dependency-cruiser) cannot read TypeScript 7 yet: with it,
      # every .ts file is silently skipped and the check passes on nothing. Stay on 6
      # until dependency-cruiser supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
