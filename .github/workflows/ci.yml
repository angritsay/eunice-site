# One pipeline: check and test on every pull request and on main. Publishing is
# pages.yml, which runs when this finishes: main goes live only if this passed, and
# each open pull request gets a preview. A daily run rebuilds so dated content
# (events moving from upcoming to past) stays current without a commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint · types · architecture rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint and format)
        run: pnpm lint
      - name: TypeScript, strict
        run: pnpm typecheck
      - name: Architecture rules (.dependency-cruiser.cjs)
        run: pnpm check:architecture

  web:
    name: Web · build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Two identical builds produce identical bytes
        run: pnpm check:determinism
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: URLs, links, layout at five widths, touch targets, WCAG 2.2 AA, rendered-HTML goldens
        run: pnpm test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
