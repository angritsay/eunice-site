# One pipeline: check and test on every pull request; on main, deploy only what
# passed, then check the live site. A daily run rebuilds so dated content (events
# moving from upcoming to past) stays current without a commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint · types · architecture rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint and format)
        run: pnpm lint
      - name: TypeScript, strict
        run: pnpm typecheck
      - name: Architecture rules (.dependency-cruiser.cjs)
        run: pnpm check:architecture
      - name: The committed OpenAPI and AsyncAPI documents are the ones the code implements
        run: |
          pnpm generate
          # The checkout is clean, so any change at all after generating is drift.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff
            echo "::error::Generated contracts are out of date. Run 'pnpm generate' and commit the result."
            exit 1
          fi

  services:
    name: Services · unit and integration (Postgres and NATS in containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (contracts, platform, services)
        run: pnpm --filter './packages/*' --filter './services/*' test
      - name: Integration tests against Postgres 18 and NATS (Testcontainers)
        run: pnpm --filter './services/*' test:integration

  system:
    name: System · docker compose, end to end in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @eunice/e2e exec playwright install --with-deps chromium
      - name: Lead flow to the ops inbox, one trace, analytics funnel, outages
        run: pnpm test:e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/playwright-report/
          retention-days: 7

  web:
    name: Web · build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Two identical builds produce identical bytes
        run: pnpm check:determinism
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: URLs, links, layout at five widths, touch targets, WCAG 2.2 AA, rendered-HTML goldens
        run: pnpm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [quality, web, services, system]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Project pages live under /<repo-name>/. Only the 404 page uses it; every
          # other link is relative. Set to / once eunice.ai points here.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Smoke-test the live site
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node reads packageManager from package.json and turns on pnpm
          # caching by default, which fails in a job that never installs pnpm.
          # This job needs no dependencies, only Node.
          package-manager-cache: false
      - run: node apps/web/scripts/smoke.mjs "${{ needs.deploy.outputs.page_url }}"
