# GitHub Pages: main at the root, and every open pull request from this repository
# at preview/pr-<N>/, so a change can be seen on a real site before it is merged.
#
# Runs after CI finishes on any branch (so after every push, and after the daily
# rebuild of main), when a pull request closes (its preview goes), or by hand. It
# runs in main's context, which the github-pages environment requires. Pull request
# code is only built, in a job with a read-only token; the job that deploys runs no
# pull request code. Forks are never built.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build main and the previews
    # A failed CI run on main leaves the live site on its last good version.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch != github.event.repository.default_branch ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      previews: ${{ steps.build.outputs.previews }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: build
        run: |
          deploy/pages-build.sh
          echo "previews=$(tr '\n' ' ' < previews.txt)" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Smoke-test the live site
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # setup-node reads packageManager from package.json and turns on pnpm
          # caching by default, which fails in a job that never installs pnpm.
          package-manager-cache: false
      - run: node apps/web/scripts/smoke.mjs "${{ needs.deploy.outputs.page_url }}"

  link:
    name: Post the preview link
    needs: [build, deploy]
    if: needs.build.outputs.previews != ''
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment once on each previewed pull request
        run: |
          for n in $PREVIEWS; do
            if gh api "repos/$REPO/issues/$n/comments" --paginate --jq '.[].body' | grep -q '<!-- preview-link -->'; then
              continue
            fi
            gh pr comment "$n" --repo "$REPO" --body "<!-- preview-link -->
          **Preview:** ${PAGE_URL}preview/pr-$n/

          This link shows this pull request on a real copy of the site. It updates a few minutes after each push, once the checks have run, and disappears when the pull request is closed. It is hidden from search engines; please don't send it to clients."
          done
        env:
          PREVIEWS: ${{ needs.build.outputs.previews }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
