# The whole system on one machine: docker compose up --build --wait, then open
#   http://localhost:8080                  the site; its forms submit for real
#   http://localhost:8080/api/intake/docs  the intake API
#   http://localhost:8025                  Mailpit: the emails ops would receive
#   http://localhost:16686                 Jaeger: one trace per submission
#   http://localhost:3001                  Umami: visits and the form funnel (admin / see .env.example)
# Defaults work without a .env; see .env.example.
name: eunice

x-intake-image: &intake-image
  image: eunice/intake:local
  build:
    context: .
    dockerfile: services/Dockerfile
    args: { SERVICE: intake }

x-notifier-image: &notifier-image
  image: eunice/notifier:local
  build:
    context: .
    dockerfile: services/Dockerfile
    args: { SERVICE: notifier }

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres}
      POSTGRES_DB: eunice
      INTAKE_OWNER_PASSWORD: ${INTAKE_OWNER_PASSWORD:-local-intake-owner}
      INTAKE_APP_PASSWORD: ${INTAKE_APP_PASSWORD:-local-intake-app}
      NOTIFIER_OWNER_PASSWORD: ${NOTIFIER_OWNER_PASSWORD:-local-notifier-owner}
      NOTIFIER_APP_PASSWORD: ${NOTIFIER_APP_PASSWORD:-local-notifier-app}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-local-umami}
    volumes:
      - postgres:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/roles.sql:/eunice/roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d eunice]
      interval: 2s
      timeout: 3s
      retries: 30

  # Migrations run once, as the schema owner, before the service starts.
  intake-migrate:
    <<: *intake-image
    command: [node, dist/migrate.mjs]
    environment:
      MIGRATION_DATABASE_URL: postgres://intake_owner:${INTAKE_OWNER_PASSWORD:-local-intake-owner}@postgres:5432/eunice
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  intake:
    <<: *intake-image
    environment:
      SERVICE_NAME: intake
      SERVICE_VERSION: local
      SITE_ENV: local
      PORT: 3000
      DATABASE_URL: postgres://intake_app:${INTAKE_APP_PASSWORD:-local-intake-app}@postgres:5432/eunice
      NATS_URL: nats://nats:4222
      ADMIN_TOKEN_SHA256: ${INTAKE_ADMIN_TOKEN_SHA256:-aeba42a41f581015a9740bbe030b9fa50c34d8d12f7ea91912b99939ff4caac0}
      CLIENT_IP_HEADER: x-forwarded-for
      # Every local request comes from one address; production keeps the default of 5.
      RATE_LIMIT_MAX: ${INTAKE_RATE_LIMIT_MAX:-200}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      intake-migrate: { condition: service_completed_successfully }
      jaeger: { condition: service_started }
      # Deliberately not a health dependency on nats: intake accepts submissions while
      # the broker is down, and its outbox catches up when it returns.
      nats: { condition: service_started }

  notifier-migrate:
    <<: *notifier-image
    command: [node, dist/migrate.mjs]
    environment:
      MIGRATION_DATABASE_URL: postgres://notifier_owner:${NOTIFIER_OWNER_PASSWORD:-local-notifier-owner}@postgres:5432/eunice
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  notifier:
    <<: *notifier-image
    environment:
      SERVICE_NAME: notifier
      SERVICE_VERSION: local
      SITE_ENV: local
      PORT: 3000
      DATABASE_URL: postgres://notifier_app:${NOTIFIER_APP_PASSWORD:-local-notifier-app}@postgres:5432/eunice
      NATS_URL: nats://nats:4222
      OPS_INBOX: ${OPS_INBOX:-ops@eunice.local}
      MAIL_FROM: Eunice site <notify@eunice.local>
      SITE_URL: http://localhost:${EDGE_PORT:-8080}
      # The same SMTP adapter production uses with Google Workspace's relay; Mailpit
      # offers no TLS, which only a non-production environment may accept.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_REQUIRE_TLS: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      notifier-migrate: { condition: service_completed_successfully }
      intake: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      jaeger: { condition: service_started }
    restart: unless-stopped

  nats:
    image: nats:2.15.0-alpine
    command: [-js, -sd, /data, -m, "8222"]
    volumes:
      - nats:/data
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email; nothing leaves your machine.
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - 8025:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 30

  # The site, built for local use with its form pointed at intake, behind the edge.
  edge:
    image: eunice/edge:local
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
      args:
        PUBLIC_ANALYTICS_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-6b0e6c1d-6c3a-4a3e-9d7b-0e1c2f3a4b5c}
    ports:
      - ${EDGE_PORT:-8080}:8080
    depends_on:
      intake: { condition: service_healthy }
      notifier: { condition: service_healthy }
      umami-bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/]
      interval: 2s
      timeout: 3s
      retries: 30

  # Analytics, self-hosted (ADR-0010). Its own schema and role; migrates itself on start.
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-local-umami}@postgres:5432/eunice?schema=umami
      APP_SECRET: ${UMAMI_APP_SECRET:-local-umami-app-secret}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    ports:
      - 3001:3000
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60

  # Replaces the default admin password and registers the site under a fixed id.
  umami-bootstrap:
    image: node:24.21.0-slim
    command: [node, /bootstrap.mjs]
    volumes:
      - ./infra/umami/bootstrap.mjs:/bootstrap.mjs:ro
    environment:
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-6b0e6c1d-6c3a-4a3e-9d7b-0e1c2f3a4b5c}
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:-local-umami-admin}
    depends_on:
      umami: { condition: service_healthy }
    restart: "no"

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - 16686:16686

volumes:
  postgres:
  nats:
