# Production, on the instance created by deploy/aws/stack.yaml (ADR-0012). The same
# services and settings as compose.yaml, tested end to end in CI, with these differences:
# images come from ECR pinned by digest (nothing is built here), Caddy serves the API
# over TLS on api.eunice.ai, email goes to Google Workspace's SMTP relay over TLS, there
# is no Mailpit or Jaeger, no database port is published, and logs go to CloudWatch.
# Every value comes from /opt/eunice-site/.env, written by deploy/render-env.sh.
name: eunice

x-logging: &logging
  logging:
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION}
      awslogs-group: /eunice-site/prod
      tag: "{{.Name}}"

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine
    <<: [*logging, *restart]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eunice
      INTAKE_OWNER_PASSWORD: ${INTAKE_OWNER_PASSWORD}
      INTAKE_APP_PASSWORD: ${INTAKE_APP_PASSWORD}
      NOTIFIER_OWNER_PASSWORD: ${NOTIFIER_OWNER_PASSWORD}
      NOTIFIER_APP_PASSWORD: ${NOTIFIER_APP_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ../infra/postgres/roles.sql:/eunice/roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d eunice]
      interval: 5s
      timeout: 3s
      retries: 30

  intake-migrate:
    image: ${INTAKE_IMAGE}
    <<: *logging
    command: [node, dist/migrate.mjs]
    environment:
      MIGRATION_DATABASE_URL: postgres://intake_owner:${INTAKE_OWNER_PASSWORD}@postgres:5432/eunice
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  intake:
    image: ${INTAKE_IMAGE}
    <<: [*logging, *restart]
    environment:
      SERVICE_NAME: intake
      SERVICE_VERSION: ${RELEASE}
      SITE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://intake_app:${INTAKE_APP_PASSWORD}@postgres:5432/eunice
      NATS_URL: nats://nats:4222
      ADMIN_TOKEN_SHA256: ${INTAKE_ADMIN_TOKEN_SHA256}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Caddy replaces any X-Forwarded-For a client sends, so this is the client's address.
      CLIENT_IP_HEADER: x-forwarded-for
    depends_on:
      intake-migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }

  notifier-migrate:
    image: ${NOTIFIER_IMAGE}
    <<: *logging
    command: [node, dist/migrate.mjs]
    environment:
      MIGRATION_DATABASE_URL: postgres://notifier_owner:${NOTIFIER_OWNER_PASSWORD}@postgres:5432/eunice
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  notifier:
    image: ${NOTIFIER_IMAGE}
    <<: [*logging, *restart]
    environment:
      SERVICE_NAME: notifier
      SERVICE_VERSION: ${RELEASE}
      SITE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://notifier_app:${NOTIFIER_APP_PASSWORD}@postgres:5432/eunice
      NATS_URL: nats://nats:4222
      OPS_INBOX: ${OPS_INBOX}
      MAIL_FROM: ${MAIL_FROM}
      SITE_URL: ${SITE_URL}
      # Google Workspace SMTP relay: accepts mail only from this instance's Elastic IP,
      # only over TLS (ADR-0012). No password is stored.
      SMTP_HOST: smtp-relay.gmail.com
      SMTP_PORT: 587
      SMTP_REQUIRE_TLS: "true"
    depends_on:
      notifier-migrate: { condition: service_completed_successfully }
      intake: { condition: service_healthy }

  nats:
    image: nats:2.15.0-alpine
    <<: [*logging, *restart]
    command: [-js, -sd, /data, -m, "8222"]
    volumes:
      - nats:/data
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 30

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    <<: [*logging, *restart]
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/eunice?schema=umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    # The dashboard is reachable only on the instance: open it with a Session Manager
    # port forward (docs/runbooks/operations.md).
    ports:
      - 127.0.0.1:3001:3000
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 60

  umami-bootstrap:
    image: node:24.21.0-slim
    <<: *logging
    command: [node, /bootstrap.mjs]
    volumes:
      - ../infra/umami/bootstrap.mjs:/bootstrap.mjs:ro
    environment:
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD}
      UMAMI_WEBSITE_DOMAIN: ${SITE_DOMAIN}
    depends_on:
      umami: { condition: service_healthy }
    restart: "no"

  caddy:
    image: caddy:2.10.2-alpine
    <<: [*logging, *restart]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      intake: { condition: service_healthy }
      notifier: { condition: service_healthy }
      umami-bootstrap: { condition: service_completed_successfully }

volumes:
  postgres:
  nats:
  caddy-data:
  caddy-config:
